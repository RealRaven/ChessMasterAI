<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ChessMasterAI — a 3D AI-vs-AI chess arena powered by local Ollama vision models." />
  <title>♟ ChessMasterAI — Qwen vs Gemma</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♟</text></svg>" />

  <!-- ========== Styles (split by concern) ========== -->
  <link rel="stylesheet" href="./src/styles/main.css" />
  <link rel="stylesheet" href="./src/styles/hud.css" />
  <link rel="stylesheet" href="./src/styles/speech-bubbles.css" />
  <link rel="stylesheet" href="./src/styles/themes.css" />

  <script>
    window.env = window.env || {};
    window.env.userBrowserCache = false;
    
    // Shim the Cache API to prevent "caches is not defined" on insecure contexts
    if (!window.caches) {
      window.caches = {
        open: async () => ({
          match: async () => undefined,
          put: async () => {},
          delete: async () => {},
        }),
        keys: async () => [],
        delete: async () => {},
      };
    }
  </script>

  <script type="importmap">
  {
    "imports": {
      "kokoro-js": "https://cdn.jsdelivr.net/npm/kokoro-js@1.2.1/dist/kokoro.web.js"
    }
  }
  </script>
</head>
<body class="theme-classic">
  <div id="app">
    <!-- Three.js WebGL canvas -->
    <div id="webgl-container"></div>
    <!-- CSS2DRenderer overlay for speech bubbles + coordinate labels -->
    <div id="css2d-container"></div>

    <!-- ========== Spectator HUD ========== -->
    <aside id="hud">
      <button id="hud-toggle" title="Collapse menu">☰</button>

      <div id="hud-header">
        <span class="brand">♟ ChessMasterAI</span>
        <span class="version">v0.1</span>
      </div>

      <!-- Controls -->
      <div class="hud-section">
        <h3>🎮 Controls</h3>
        <div class="hud-row">
          <button id="btn-play" class="btn-primary">▶ Play</button>
          <button id="btn-pause">⏸ Pause</button>
          <button id="btn-step">⏭ Step</button>
          <button id="btn-reset" class="btn-danger">⟲ Reset</button>
        </div>
      </div>

      <!-- Board Theme -->
      <div class="hud-section">
        <h3>🎨 Board Theme</h3>
        <select id="theme-select">
          <option value="classic">Classic Wood</option>
          <option value="cyberpunk">Cyberpunk Neon</option>
          <option value="marble">Marble &amp; Obsidian</option>
        </select>
      </div>

      <!-- Models & Personality (Only ONE instance) -->
      <div class="hud-section">
        <h3>🤖 Models &amp; Personality</h3>
        <label class="field-label">White (Qwen)</label>
        <input type="text" id="model-white" value="qwen3.5:9b" placeholder="ollama model tag" />
        <select id="personality-white">
          <option value="trash">Trash-Talking Grandmaster</option>
          <option value="polite">Polite Philosopher</option>
          <option value="chaotic">Chaotic Gremlin</option>
        </select>
        <label class="field-label">Black (Gemma)</label>
        <input type="text" id="model-black" value="gemma4:e4b" placeholder="ollama model tag" />
        <select id="personality-black">
          <option value="trash">Trash-Talking Grandmaster</option>
          <option value="polite">Polite Philosopher</option>
          <option value="chaotic">Chaotic Gremlin</option>
        </select>
        <label style="display:flex; align-items:center; gap:6px; font-size:11px; margin-top:8px; color:var(--text-dim);">
          <input type="checkbox" id="text-only-mode">
          Text-only mode (no images)
        </label>
      </div>

      <!-- Avatar Upload -->
      <div class="hud-section">
        <h3>🖼️ Avatar Upload (.glb)</h3>
        <label class="file-label">White: <input type="file" id="upload-white" accept=".glb,.gltf" /></label>
        <label class="file-label">Black: <input type="file" id="upload-black" accept=".glb,.gltf" /></label>
      </div>

      <!-- Camera Presets -->
      <div class="hud-section">
        <h3>📷 Camera Presets</h3>
        <div class="hud-row">
          <button data-cam="free">Free Orbit</button>
          <button data-cam="overhead">Overhead</button>
          <button data-cam="white">White POV</button>
          <button data-cam="black">Black POV</button>
          <button data-cam="auto">Auto-Cam</button>
        </div>
      </div>

      <!-- Audio / TTS -->
      <div class="hud-section">
        <h3>🔊 Audio / TTS</h3>
        <div class="hud-row">
          <button id="btn-mute-sfx">SFX: On</button>
          <button id="btn-mute-tts">TTS: On</button>
        </div>
      </div>

      <!-- Whisper / Sabotage -->
      <div class="hud-section">
        <h3>🕵️ Whisper / Sabotage</h3>
        <div class="hud-row">
          <input type="text" id="whisper-input" placeholder="Secret hint for active AI…" />
          <button id="btn-whisper">Send</button>
        </div>
      </div>

      <!-- Vision Preview -->
      <div class="hud-section">
        <h3>📸 Vision Preview</h3>
        <img id="vision-preview" alt="Snapshot sent to LLM" style="display:none" />
        <div id="vision-status">No snapshot yet</div>
      </div>

      <!-- Referee Log -->
      <div class="hud-section">
        <h3>⚖️ Referee Log</h3>
        <div id="referee-log" class="log-pane"></div>
      </div>

      <!-- Move History -->
      <div class="hud-section">
        <h3>📜 Move History</h3>
        <div id="move-history" class="log-pane log-moves"></div>
        <button id="btn-export-pgn" class="full-width">⬇ Export PGN</button>
      </div>

      <!-- Chat Transcript -->
      <div class="hud-section">
        <h3>💬 Chat Transcript</h3>
        <div id="chat-transcript" class="log-pane"></div>
      </div>

      <!-- Footer -->
      <div id="hud-footer">
        <a href="https://github.com/RealRaven/ChessMasterAI" target="_blank" rel="noopener">
          github.com/RealRaven/ChessMasterAI
        </a>
      </div>
    </aside>

    <!-- Status Badge (top right) -->
    <div id="status-badge">Initializing…</div>
  </div>

  <!-- ========== Vendor UMD libraries ========== -->
  <script src="./vendor/three.min.js"></script>
  <script src="./vendor/OrbitControls.js"></script>
  <script src="./vendor/GLTFLoader.js"></script>
  <script src="./vendor/CSS2DRenderer.js"></script>
  <script src="./vendor/chess.min.js"></script>

  <!-- ========== Application entry point ========== -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
